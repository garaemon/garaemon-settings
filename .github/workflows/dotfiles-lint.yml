name: Dotfiles Lint

on:
  push:
    branches: [main]
    paths:
      - 'dotfiles/**'
      - '.github/workflows/dotfiles-lint.yml'
      - '.pre-commit-config.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'dotfiles/**'
      - '.github/workflows/dotfiles-lint.yml'
      - '.pre-commit-config.yaml'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotfiles
    steps:
      - uses: actions/checkout@v5
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck on zsh files
        run: |
          shellcheck \
            dot_zshrc \
            dot_zshenv \
            dot_zlogin \
            dot_zlogout \
            dot_zshrc.zplug \
            dot_zsh/*.zsh
      - name: Run ShellCheck on shell scripts in bin
        run: |
          for f in dot_local/bin/executable_*; do
            # Skip non-shell scripts (e.g. Python)
            head -1 "$f" | grep -q 'python' && continue
            shellcheck "$f"
          done
      - name: Run ShellCheck on install.sh
        run: shellcheck install.sh

  trailing-whitespace:
    name: Trailing Whitespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for trailing whitespace
        run: |
          targets="dotfiles/dot_zshrc dotfiles/dot_zshenv"
          targets="$targets dotfiles/dot_zlogin dotfiles/dot_zlogout"
          targets="$targets dotfiles/dot_zshrc.zplug dotfiles/dot_zsh/"
          targets="$targets dotfiles/dot_gitconfig.tmpl dotfiles/dot_tmux.conf"
          targets="$targets dotfiles/dot_vimrc dotfiles/dot_tigrc"
          targets="$targets dotfiles/scripts/"
          targets="$targets .github/workflows/dotfiles-lint.yml"
          targets="$targets .github/workflows/dotfiles-test.yml"
          targets="$targets .github/workflows/dotfiles-update-pinned-tools.yml"
          targets="$targets .pre-commit-config.yaml"
          targets="$targets dotfiles/README.md"
          if grep -rn ' $' $targets 2>/dev/null; then
            echo "::error::Trailing whitespace found"
            exit 1
          fi
          echo "No trailing whitespace found"

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: >-
          yamllint -d relaxed
          .pre-commit-config.yaml
          .github/workflows/dotfiles-lint.yml
          .github/workflows/dotfiles-test.yml
          .github/workflows/dotfiles-update-pinned-tools.yml
          dotfiles/.markdownlint.yaml

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: "dotfiles/**/*.md"
