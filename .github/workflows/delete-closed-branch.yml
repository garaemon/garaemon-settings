name: Delete closed branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  delete-branch:
    # The local path runs the copy on the pull request's merge commit, so a
    # change to the reusable workflow gets exercised before it reaches main.
    uses: ./.github/workflows/delete-closed-branch-reusable.yml
