---
# One lint workflow for the whole monorepo. Jobs are split by language, not by
# subdirectory, so every file gets the same checks wherever it lives. Each job
# delegates to scripts/lint.sh, which developers run locally.
#
# The workflow itself always starts, so a required "Lint" check never stays
# pending. The changes job decides which language jobs have files to lint, and
# the rest are skipped, which GitHub reports as a pass.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # paths-filter lists the changed files of a pull request through the API.
  pull-requests: read

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      markdown: ${{ steps.filter.outputs.markdown }}
      javascript: ${{ steps.filter.outputs.javascript }}
      yaml: ${{ steps.filter.outputs.yaml }}
      python: ${{ steps.filter.outputs.python }}
      ansible: ${{ steps.filter.outputs.ansible }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Every list names the linted files plus the linter's own config, so
          # a rule change re-lints the whole tree. lint.sh and this workflow
          # belong to every list because they define how each target runs.
          # Shell scripts without an extension (shebang files) live under
          # dotfiles/ and claude-skills/scripts/.
          filters: |
            shell:
              - '**/*.sh'
              - '**/*.bash'
              - '**/*.zsh'
              - '**/*.sh.tmpl'
              - 'dotfiles/**'
              - 'claude-skills/scripts/**'
              - 'scripts/lint.sh'
              - '.github/workflows/lint.yml'
            markdown:
              - '**/*.md'
              - '.markdownlint.yaml'
              - 'scripts/lint.sh'
              - '.github/workflows/lint.yml'
            javascript:
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.html'
              - 'eslint.config.mjs'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/lint.sh'
              - '.github/workflows/lint.yml'
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
              - '.yamllint.yaml'
              - 'scripts/lint.sh'
              - '.github/workflows/lint.yml'
            python:
              - '**/*.py'
              - 'ruff.toml'
              - 'scripts/lint.sh'
              - '.github/workflows/lint.yml'
            ansible:
              - 'ansible/**'
              - 'scripts/lint.sh'
              - '.github/workflows/lint.yml'

  shell:
    name: Shell
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ubuntu-latest ships ShellCheck; the act image does not.
      - name: Install ShellCheck
        run: >-
          command -v shellcheck ||
          (sudo apt-get update && sudo apt-get install -y shellcheck)
      - name: Run ShellCheck
        run: scripts/lint.sh shell

  markdown:
    name: Markdown
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run markdownlint
        run: scripts/lint.sh markdown

  javascript:
    name: JavaScript
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install ESLint
        run: npm ci
      - name: Run ESLint
        run: scripts/lint.sh javascript

  yaml:
    name: YAML
    needs: changes
    if: needs.changes.outputs.yaml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: scripts/lint.sh yaml

  python:
    name: Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: scripts/lint.sh python

  ansible:
    name: Ansible
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ !env.ACT }}
        with:
          python-version: '3.x'
      - name: Install ansible-lint (GitHub Actions)
        if: ${{ !env.ACT }}
        run: pip install ansible-lint
      - name: Install ansible-lint (act)
        if: ${{ env.ACT }}
        run: pip install --break-system-packages --ignore-installed ansible-lint
      - name: Run ansible-lint
        run: scripts/lint.sh ansible

  whitespace:
    name: Trailing whitespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for trailing whitespace
        run: scripts/lint.sh whitespace
