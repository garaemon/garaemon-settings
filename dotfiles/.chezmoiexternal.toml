# Clone the repositories that dot_zshrc sources, so machines without sudo,
# where Ansible never runs, get them too. chezmoi skips an existing clone and
# pulls only with `chezmoi apply --refresh-externals`.

[".local/share/zsh/plugins/z"]
type = "git-repo"
url = "https://github.com/rupa/z.git"

[".local/share/dircolors-solarized"]
type = "git-repo"
url = "https://github.com/seebi/dircolors-solarized.git"
