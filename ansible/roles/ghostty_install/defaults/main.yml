ghostty_install_github_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"
# Ghostty 1.4 ships no .deb for these Ubuntu releases, so they install the last
# ghostty-ubuntu release that still has one instead of the latest release.
ghostty_install_pinned_tags:
  '24.04': 1.3.1-0-ppa2
  '25.10': 1.3.1-0-ppa2
