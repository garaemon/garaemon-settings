# Release-specific package names, keyed by Ubuntu version. A release without
# an entry is unsupported, and tasks/main.yml skips the apt step there.
emacs_build_packages_by_release:
  '22.04':
    - g++-10
    - gcc-10
    - libflac8
    - libgccjit-11-dev
    - libgdk-pixbuf2.0-0
    - libxml2
  '24.04':
    - g++-10
    - gcc-10
    - libflac12
    - libgccjit-13-dev
    - libgdk-pixbuf2.0-0
    - libxml2
  '26.04':
    - g++-15
    - gcc-15
    - libflac14
    - libgccjit-15-dev
    - libgdk-pixbuf-2.0-0
    - libxml2-16

emacs_build_packages_release_specific: >-
  {{ emacs_build_packages_by_release.get(
       ansible_facts.distribution_version, []) }}
emacs_build_packages: >-
  {{ (emacs_build_packages_common + emacs_build_packages_release_specific)
     | unique | sort }}
