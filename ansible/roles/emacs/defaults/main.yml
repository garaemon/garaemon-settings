# Set the variable true if you want to build emacs from source.
# emacs.d/scripts/build_emacs.py pins the Emacs version to build.
emacs_build_emacs: false

# Directory the Emacs source is cloned into and built in.
emacs_source_path: >-
  {{ (ghq_root_path | default(ansible_facts.env.HOME + '/ghq'))
     + '/github.com/emacs-mirror/emacs' }}

# Build dependencies shared by every supported release, following
# https://github.com/KarimAziev/build-emacs/blob/main/build-emacs.sh.
# Names that change between releases go in emacs_build_packages_by_release.
