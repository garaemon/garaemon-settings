# The ~/.emacs.d symlink is managed by chezmoi
# (dotfiles/symlink_dot_emacs.d.tmpl), not by this role. This role only
# builds the Emacs binary.

# Only for ubuntu
- name: Build emacs for Debian
  when:
    - ansible_facts.os_family == "Debian"
    - emacs_build_emacs | bool
  block:
    # The script module copies the script from this checkout to the managed
    # host before running it, so the role also works over ssh.
    - name: Set the path of the build script
      ansible.builtin.set_fact:
        emacs_build_script: "{{ role_path }}/../../../emacs.d/scripts/build_emacs.py"

    # The script exits with 10 when the Emacs under ~/.local is missing or
    # older than the version that the script builds.
    # --check changes nothing, so the task also runs under ansible-playbook
    # --check, where the next block needs its return code.
    - name: Check whether Emacs needs a build
      ansible.builtin.script:
        cmd: "{{ emacs_build_script }} --check"
        executable: python3
      check_mode: false
      register: emacs_build_check
      changed_when: false
      failed_when: emacs_build_check.rc not in [0, 10]

    - name: Build Emacs if not already installed or version is too old
      when: emacs_build_check.rc == 10
      block:
      # Refer to https://github.com/KarimAziev/build-emacs/blob/main/build-emacs.sh
        - name: Install packages to build emacs
          apt:
            name: "{{ emacs_build_packages }}"
            state: present
          become: true
          when: ansible_facts.distribution_version in emacs_build_packages_by_release
        # The apt step above installs GTK 3, the image libraries, GnuTLS,
        # SQLite, and libgccjit, so a missing one must fail the build instead
        # of silently dropping its feature.
        - name: Build and install Emacs
          ansible.builtin.script:
            cmd: >-
              {{ emacs_build_script }}
              --source-dir {{ emacs_source_path | quote }}
              --gui pgtk --gnutls yes --sqlite yes --native-compilation aot
            executable: python3
